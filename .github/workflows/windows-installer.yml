name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.91.1-x86_64-pc-windows-msvc
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_INCREMENTAL: '0'
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      filename: ${{ steps.package.outputs.filename }}
      sha256: ${{ steps.package.outputs.sha256 }}
      commit: ${{ steps.package.outputs.commit }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false

      - name: Install Rust and its bundled copyright notices
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rust-docs

      - name: Verify version
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'literature-reader'
          $version = $package.version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Cargo.toml must use a stable three-part version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Inno Setup
        id: inno
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          # Digest from the immutable upstream is-6_7_4 release.
          $digest = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri $uri -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 2
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $digest) {
              throw 'Inno Setup download failed SHA-256 verification.'
          }
          $arguments = @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE=1', "/DIR=`"$directory`"")
          $result = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          $compiler = Join-Path $directory 'ISCC.exe'
          if ($result.ExitCode -ne 0 -or !(Test-Path -LiteralPath $compiler -PathType Leaf)) {
              throw "Inno Setup installation failed with exit code $($result.ExitCode)."
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Stage the layout runtime
        run: |
          python -m pip install --quiet "onnxruntime-directml==1.24.4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $capi = python -c "import onnxruntime, os; print(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi'))"
          $root = 'target\release\runtime'
          New-Item -ItemType Directory -Force "$root\layout" | Out-Null
          Copy-Item -LiteralPath (Join-Path $capi 'onnxruntime.dll') -Destination "$root\onnxruntime.dll"
          Copy-Item -LiteralPath (Join-Path $capi 'DirectML.dll') -Destination "$root\DirectML.dll"
          $url = 'https://huggingface.co/wybxc/DocLayout-YOLO-DocStructBench-onnx/resolve/main/doclayout_yolo_docstructbench_imgsz1024.onnx'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile "$root\layout\doclayout.onnx" -MaximumRetryCount 3 -RetryIntervalSec 2
          $digest = (Get-FileHash -LiteralPath "$root\layout\doclayout.onnx" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'fece9af02f618b603ff7921ccec6861d13e7e1f9830e091dfb7e8ad9311e5b21') {
              throw 'Layout model download failed SHA-256 verification.'
          }

      - name: Build the Windows x64 executable
        run: |
          $flags = @('-C', 'target-feature=+crt-static',
              "--remap-path-prefix=$env:GITHUB_WORKSPACE=/src/literature-reader",
              "--remap-path-prefix=$env:USERPROFILE=/src/toolchain",
              '-C', 'link-arg=/PDBALTPATH:%_PDB%')
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]31
          cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package the installer
        id: package
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          ISCC: ${{ steps.inno.outputs.compiler }}
        run: |
          .\installer\build.ps1 -Compiler $env:ISCC `
              -AppExecutable 'target\x86_64-pc-windows-msvc\release\literature-reader.exe'
          $filename = "LiteratureReader-Setup-$env:APP_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath "target\release\$filename"
          $info = $installer.VersionInfo
          $embeddedVersion = [version]::new($info.ProductMajorPart, $info.ProductMinorPart,
              $info.ProductBuildPart, $info.ProductPrivatePart)
          $expectedVersion = [version]"$($env:APP_VERSION).0"
          if ($embeddedVersion -ne $expectedVersion) {
              throw "Installer product version $embeddedVersion does not match Cargo version $expectedVersion."
          }
          Write-Host "Verified installer product version $embeddedVersion."
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "artifact=LiteratureReader-Windows-x64-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "filename=$filename" >> $env:GITHUB_OUTPUT
          "sha256=$digest" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "``$filename`` SHA-256 ``$digest``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the installer artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: target/release/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload the reader executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reader-exe
          path: target/x86_64-pc-windows-msvc/release/literature-reader.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload the layout runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: layout-runtime
          path: target/release/runtime
          if-no-files-found: error
          compression-level: 0

  build_wayland:
    name: Linux Wayland x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.91.1-x86_64-unknown-linux-gnu
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_INCREMENTAL: '0'
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      filename: ${{ steps.package.outputs.filename }}
      sha256: ${{ steps.package.outputs.sha256 }}
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false

      - name: Install Rust and its bundled copyright notices
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-docs

      - name: Install GTK and Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev weston dbus-daemon desktop-file-utils poppler-utils

      - name: Verify version
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "literature-reader") | .version')
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Cargo.toml must use a stable three-part version.' >&2
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test the Linux x86_64 executable
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          cargo test --release --locked --target x86_64-unknown-linux-gnu

      - name: Package and smoke-test the native Wayland build
        id: package
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash installer/build-wayland.sh
          filename="LiteratureReader-Wayland-$APP_VERSION-x86_64.tar.gz"
          path="target/release/$filename"
          bash installer/linux/smoke-wayland.sh "$path"
          digest=$(sha256sum -- "$path" | cut -d ' ' -f 1)
          commit=$(git rev-parse HEAD)
          {
            echo "artifact=LiteratureReader-Wayland-x86_64-$GITHUB_RUN_ATTEMPT"
            echo "filename=$filename"
            echo "sha256=$digest"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          printf '\x60%s\x60 SHA-256 \x60%s\x60\n' "$filename" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Wayland archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: target/release/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, build_wayland]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false

      - name: Download the reader executable
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: reader-exe
          path: ${{ runner.temp }}/reader-exe

      - name: Download the layout runtime
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: layout-runtime
          path: ${{ runner.temp }}/layout-runtime

      - name: Install the Tern backend dependencies
        run: |
          npm.cmd ci --prefix bridge --omit=dev --ignore-scripts --no-audit --no-fund --no-update-notifier
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $url = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip'
          $hash = '7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile poppler.zip
          if ((Get-FileHash poppler.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw 'Downloaded Poppler archive failed SHA-256 verification.'
          }
          Expand-Archive -LiteralPath poppler.zip -DestinationPath poppler -Force

      - name: Package the portable Tern backend
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $bin = (Get-ChildItem poppler -Recurse -Filter pdftotext.exe | Select-Object -First 1).DirectoryName
          if (!$bin) { throw 'Poppler tools are missing from the archive.' }
          $reader = (Get-ChildItem "$env:RUNNER_TEMP/reader-exe" -Recurse -Filter literature-reader.exe | Select-Object -First 1).FullName
          if (!$reader) { throw 'The reader executable artifact is missing.' }
          $layout = "$env:RUNNER_TEMP/layout-runtime"
          if (!(Test-Path "$layout/onnxruntime.dll") -and (Test-Path "$layout/runtime/onnxruntime.dll")) {
              $layout = "$layout/runtime"
          }
          if (!(Test-Path "$layout/onnxruntime.dll")) { throw 'The layout runtime artifact is missing.' }
          ./installer/package-backend.ps1 `
              -AppExecutable $reader `
              -NodeExe (Get-Command node).Source `
              -PopplerDir $bin `
              -BridgeDir bridge `
              -OutputDir target/tern-backend `
              -ReleaseTag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./installer/package-layout.ps1 `
              -AppExecutable $reader `
              -RuntimeDir $layout `
              -OutputDir target/tern-layout `
              -ReleaseTag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the installer artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/reader-release

      - name: Download the Wayland archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build_wayland.outputs.artifact }}
          path: ${{ runner.temp }}/reader-wayland-release

      - name: Publish the verified desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          INSTALLER_NAME: ${{ needs.build.outputs.filename }}
          INSTALLER_SHA256: ${{ needs.build.outputs.sha256 }}
          WAYLAND_COMMIT: ${{ needs.build_wayland.outputs.commit }}
          WAYLAND_NAME: ${{ needs.build_wayland.outputs.filename }}
          WAYLAND_SHA256: ${{ needs.build_wayland.outputs.sha256 }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $path = Join-Path (Join-Path $env:RUNNER_TEMP 'reader-release') $env:INSTALLER_NAME
          $installer = Get-Item -LiteralPath $path
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $env:INSTALLER_SHA256) {
              throw 'Downloaded artifact failed SHA-256 verification.'
          }
          $waylandPath = Join-Path (Join-Path $env:RUNNER_TEMP 'reader-wayland-release') $env:WAYLAND_NAME
          $wayland = Get-Item -LiteralPath $waylandPath
          if ((Get-FileHash -LiteralPath $waylandPath -Algorithm SHA256).Hash -ne $env:WAYLAND_SHA256) {
              throw 'Downloaded Wayland archive failed SHA-256 verification.'
          }
          $commit = gh api "repos/$repo/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:BUILD_COMMIT -or $commit -ne $env:WAYLAND_COMMIT) {
              throw 'Release tag does not point to both package builds.'
          }

          $manifestName = 'reader-update.json'
          $manifestPath = Join-Path $installer.DirectoryName $manifestName
          $packages = @(
              @{ File = $installer; Hash = $env:INSTALLER_SHA256 }
              @{ File = $wayland; Hash = $env:WAYLAND_SHA256 }
          )
          $manifest = [ordered]@{
              tag_name = $tag
              draft = $false
              prerelease = $false
              assets = @($packages | ForEach-Object {
                  [ordered]@{
                      name = $_.File.Name
                      state = 'uploaded'
                      size = $_.File.Length
                      browser_download_url = "https://github.com/$repo/releases/download/$tag/$($_.File.Name)"
                      digest = "sha256:$($_.Hash)"
                  }
              })
          } | ConvertTo-Json -Depth 4 -Compress
          [IO.File]::WriteAllText($manifestPath, $manifest)
          $manifestFile = Get-Item -LiteralPath $manifestPath
          $manifestDigest = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $ternFiles = @(
              Get-Item -LiteralPath 'target/tern-backend/literature-reader-tern-backend-win-x64.zip'
              Get-Item -LiteralPath 'target/tern-backend/literature-reader-tern.json'
          ) | ForEach-Object {
              @{ File = $_; Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $layoutFiles = @(
              Get-Item -LiteralPath 'target/tern-layout/literature-reader-tern-layout-win-x64.zip'
              Get-Item -LiteralPath 'target/tern-layout/literature-reader-tern-layout.json'
          ) | ForEach-Object {
              @{ File = $_; Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $publishedFiles = $packages + @{ File = $manifestFile; Hash = $manifestDigest } + $ternFiles + $layoutFiles
          $uploadPaths = @($publishedFiles | ForEach-Object { $_.File.FullName })

          function Get-Release {
              $data = gh api --paginate "repos/$repo/releases?per_page=100" --jq ".[] | select(.tag_name == `"$tag`")"
              if ($LASTEXITCODE -ne 0) { throw 'Could not read releases from GitHub.' }
              $data | ConvertFrom-Json
          }

          $release = Get-Release
          if (!$release) {
              $notesPath = Join-Path $installer.DirectoryName 'release-notes.md'
              $notes = @(
                  '### 按平台下载安装',
                  '',
                  "- **Windows x64** [下载安装程序](https://github.com/$repo/releases/download/$tag/$env:INSTALLER_NAME)",
                  "- **Linux Wayland x86_64** [下载压缩包](https://github.com/$repo/releases/download/$tag/$env:WAYLAND_NAME) · [运行说明](https://github.com/$repo/blob/$tag/installer/linux/README.md)"
              ) -join "`n"
              [IO.File]::WriteAllText($notesPath, $notes)
              gh release create $tag @uploadPaths --repo $repo --verify-tag --target $commit --title $tag --notes-file $notesPath --generate-notes --draft
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $release = Get-Release
          }
          $assets = @($release.assets)
          if ($assets.Count -ne $publishedFiles.Count) {
              throw "Release $tag does not contain the expected number of assets."
          }
          foreach ($item in $publishedFiles) {
              $match = @($assets | Where-Object name -CEQ $item.File.Name)
              if ($match.Count -ne 1 -or $match[0].state -ne 'uploaded' -or
                  $match[0].size -ne $item.File.Length -or $match[0].digest -ne "sha256:$($item.Hash)") {
                  throw "Release $tag could not verify $($item.File.Name)."
              }
          }
          if ($release.draft) {
              $published = gh api --method PATCH "repos/$repo/releases/$($release.id)" -F draft=false -f make_latest=legacy
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $release = $published | ConvertFrom-Json
          }
          if ($release.draft -or !$release.published_at) { throw 'GitHub has not published the release.' }
          $release.html_url
